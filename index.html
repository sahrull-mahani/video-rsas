<!DOCTYPE html>
<html>
<head>
    <title>Video Looper</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #101010; overflow: hidden; }
        body { display: grid; place-items: center; isolation: isolate; }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(0, 0, 0, 0.6);
        }
        .backdrop {
            position: fixed;
            inset: -20px;
            z-index: -2;
            width: calc(100% + 40px);
            height: calc(100% + 40px);
            object-fit: cover;
            filter: blur(18px);
        }
        .player {
            position: relative;
            width: min(100vw, 56.25dvh);
            aspect-ratio: 9 / 16;
            max-height: 100dvh;
            background: #000;
        }
        .player video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <video class="backdrop" src="video.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
    <main class="player">
        <video id="main-video" src="video.mp4" autoplay loop playsinline controls></video>
    </main>
    <script>
        const video = document.getElementById("main-video");

        function enterFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function enableSoundAndFullscreen() {
            video.muted = false;
            video.play().catch(() => {});
            enterFullscreen();
            window.removeEventListener("pointerdown", enableSoundAndFullscreen);
            window.removeEventListener("keydown", enableSoundAndFullscreen);
        }

        async function autoplayWithSound() {
            try {
                await video.play();
            } catch {
                video.muted = true;
                video.play().catch(() => {});
            }
        }

        autoplayWithSound();
        enterFullscreen();
        window.addEventListener("pointerdown", enableSoundAndFullscreen);
        window.addEventListener("keydown", enableSoundAndFullscreen);
    </script>
</body>
</html>
